name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ghidra:
          - "12.1.4"
          - "12.1.3"
          - "12.1.2"
          - "12.1"
          - "12.0.4"
          - "12.0.3"
          - "12.0.2"
          - "12.0.1"
          - "12.0"

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4
  
    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Ghidra ${{ matrix.ghidra }}
      uses: antoniovazquezblanco/setup-ghidra@v2.2.1
      with:
        auth_token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ matrix.ghidra }}

    - name: Build
      run: $GHIDRA_INSTALL_DIR/support/gradle/gradlew -PGHIDRA_INSTALL_DIR=$GHIDRA_INSTALL_DIR

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GhidraRSP_Ghidra_${{ matrix.ghidra }}
        path: dist/*.zip

  release:
    runs-on: "ubuntu-latest"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download binaries
      uses: actions/download-artifact@v4

    - name: Release stable
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create "${{ github.ref_name }}"
        --repo "${{ github.repository }}"
        --title "Ghidra RSP ${{ github.ref_name }}"
        --generate-notes
        GhidraRSP_Ghidra_*/*.zip
